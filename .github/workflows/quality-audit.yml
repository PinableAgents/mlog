name: Quality audit
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      audited_sha:
        description: Exact commit approved by every required gate
        value: ${{ jobs.gate.outputs.audited_sha }}
permissions:
  contents: read
# A called workflow inherits github.workflow; the prefix must differ from Auto Release.
concurrency:
  group: quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      audited_sha: ${{ steps.validated.outputs.audited_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: Strict quality checks
        run: bash scripts/quality_gate.sh "$RUNNER_TEMP/quality-results"
      - name: Record validated commit
        id: validated
        run: |
          test "$(cat "$RUNNER_TEMP/quality-results/validated-sha.txt")" = "$GITHUB_SHA"
          echo "audited_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: ${{ runner.temp }}/quality-results/
          retention-days: 14
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      audited_sha: ${{ steps.validated.outputs.audited_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
      - name: Supported toolchain and vulnerability checks
        run: bash scripts/security_gate.sh "$RUNNER_TEMP/security-results"
      - name: Record validated commit
        id: validated
        run: |
          test "$(cat "$RUNNER_TEMP/security-results/validated-sha.txt")" = "$GITHUB_SHA"
          echo "audited_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: ${{ runner.temp }}/security-results/*.txt
          retention-days: 14
          if-no-files-found: error
  gate:
    name: Strict quality gate
    needs: [quality, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      audited_sha: ${{ steps.verdict.outputs.audited_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require both successes for this exact commit
        id: verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/require_quality.py
