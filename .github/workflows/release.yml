name: Auto Release
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
permissions:
  contents: read
# One publisher across BOTH release branches; never cancel a run during a push.
concurrency:
  group: mlog-auto-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve release skip markers and version-commit guard
        id: plan
        run: python3 scripts/release_metadata.py eligible --source "$GITHUB_SHA"
  audit:
    needs: preflight
    if: ${{ needs.preflight.outputs.eligible == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/quality-audit.yml
    # No secrets: inherit and no arbitrary checkout ref; audit the same commit.
  release:
    needs: [preflight, audit]
    if: >-
      ${{ needs.preflight.outputs.eligible == 'true' &&
          needs.audit.result == 'success' &&
          needs.audit.outputs.audited_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # This is the ONLY workflow job that can write tags or releases.
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse a stale source; prepare version change locally only
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" == main || "$RELEASE_BRANCH" == master ]]
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 scripts/release_metadata.py prepare --source "$SOURCE_SHA" --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: Revalidate final candidate (including updated Version constant)
        run: bash scripts/quality_gate.sh "$RUNNER_TEMP/candidate-quality"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Revalidate final candidate security
        run: bash scripts/security_gate.sh "$RUNNER_TEMP/candidate-security"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-evidence
          path: |
            ${{ runner.temp }}/candidate-quality/
            ${{ runner.temp }}/candidate-security/*.txt
            ${{ runner.temp }}/release-notes.md
          retention-days: 14
          if-no-files-found: error
      - name: Publish only the exact fully validated candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(cat "$RUNNER_TEMP/candidate-quality/validated-sha.txt")" = "$CANDIDATE_SHA"
          test "$(cat "$RUNNER_TEMP/candidate-security/validated-sha.txt")" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"
          # Atomic, non-force push: a branch advance or existing tag blocks BOTH refs.
          git tag -a "$RELEASE_VERSION" "$CANDIDATE_SHA" -m "Release $RELEASE_VERSION"
          git push --atomic origin "$CANDIDATE_SHA:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_VERSION"
          # Never let the release API manufacture a tag on an unchecked commit.
          gh release create "$RELEASE_VERSION" --verify-tag --target "$CANDIDATE_SHA" \
            --title "Release $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
